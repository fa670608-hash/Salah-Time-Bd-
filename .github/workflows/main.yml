name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Find files and unpack bundle
        run: |
          B=$(ls bundle*.txt 2>/dev/null | head -n 1)
          L=$(ls logo*.png 2>/dev/null | head -n 1)
          echo "bundle file: [$B]  logo file: [$L]"
          if [ -z "$B" ]; then echo "ERROR: no bundle*.txt file found in the repo root"; ls; exit 1; fi
          python3 -c 'import os,re,sys
          t=open(sys.argv[1],encoding="utf-8").read()
          n=0
          for m in re.finditer(r"=== FILE: (.+?) ===\n(.*?)\n=== END ===",t,re.S):
              p=m.group(1)
              os.makedirs(os.path.dirname(p) or ".",exist_ok=True)
              open(p,"w",encoding="utf-8").write(m.group(2)+"\n")
              n+=1
          print("unpacked files:",n)' "$B"
          mkdir -p assets
          if [ ! -f assets/logo.png ] && [ -n "$L" ]; then cp "$L" assets/logo.png; fi
          test -f pubspec.yaml || { echo "ERROR: pubspec.yaml missing after unpack. Is the bundle file complete?"; exit 1; }
          test -f assets/logo.png || { echo "ERROR: no logo*.png file found in the repo root"; ls; exit 1; }
          echo "Unpack OK"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android project
        run: |
          flutter create --platforms=android --org com.bjdfarhma --project-name salah .
          rm -rf test

      - name: Patch Android (Firebase, permissions, notifications)
        run: python3 tool/patch_android.py

      - name: Check the patch really applied
        run: |
          grep -rq "google-services" android/settings.gradle* || { echo "ERROR: google-services missing in settings.gradle"; exit 1; }
          grep -q "google-services" android/app/build.gradle* || { echo "ERROR: google-services missing in app/build.gradle"; exit 1; }
          grep -q "ScheduledNotificationReceiver" android/app/src/main/AndroidManifest.xml || { echo "ERROR: notification receiver missing in manifest"; exit 1; }
          grep -q "com.bjdfarhma.salah" android/app/build.gradle* || { echo "ERROR: wrong applicationId"; exit 1; }
          test -f android/app/google-services.json || { echo "ERROR: google-services.json not copied"; exit 1; }
          echo "Patch OK"

      - name: Install packages
        run: flutter pub get

      - name: Make launcher icons
        run: dart run flutter_launcher_icons

      - name: Build release APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: salah-time-apk
          path: build/app/outputs/flutter-apk/app-release.apk
